name: Beta

# The iteration loop. Every push to a development branch rebuilds the portable
# Windows exe and republishes it under a single, permanent `beta` tag, so the
# download URL never changes:
#
#   .../releases/download/beta/Dev-Hub-beta-win-x64-portable.exe
#   .../releases/download/beta/Log-Viewer-beta-win-x64-portable.exe
#   .../releases/download/beta/Markdown-Notebook-beta-win-x64-portable.exe
#
# Bookmark those URLs on the work PC: each new build replaces the files at the
# same addresses, so testing a change is "download, overwrite, run" with no
# hunting for a release page. Your DevHubData and LogViewerData folders are
# untouched by a swap.
#
# Both exes ship from one build of one workspace, so they are always the same
# version and always agree about the suite registry between them.
#
# `.github/workflows/release.yml` handles real, versioned releases from a v*
# tag; this workflow is deliberately separate so a beta can never be mistaken
# for one.
on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

# A newer push supersedes a running beta build — the rolling tag should always
# hold the newest commit, not whichever build happened to finish last.
concurrency:
  group: beta
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-beta-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-beta-

      # A beta you can't trust is worse than no beta, so the same tests that
      # gate CI gate the download.
      - name: Unit tests
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Name the artifacts
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/dev-hub.exe"          "dist/Dev-Hub-beta-win-x64-portable.exe"
          cp "target/release/log-viewer.exe"       "dist/Log-Viewer-beta-win-x64-portable.exe"
          cp "target/release/markdown-notebook.exe" "dist/Markdown-Notebook-beta-win-x64-portable.exe"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Write the release notes
        shell: bash
        run: |
          cat > release-notes.md <<NOTES
          **Rolling beta** — rebuilt on every push. This tag always points at the
          newest development build of the whole suite.

          | App | Download |
          | --- | --- |
          | Dev Hub | \`Dev-Hub-beta-win-x64-portable.exe\` |
          | Log Viewer | \`Log-Viewer-beta-win-x64-portable.exe\` |
          | Markdown Notebook | \`Markdown-Notebook-beta-win-x64-portable.exe\` |

          Both are built from one commit of one workspace, so they always agree
          about the suite registry. Drop them in the same folder and they find
          each other — Dev Hub's Logs card opens files in Log Viewer, its Todos
          card opens notes in Markdown Notebook, and each app can launch its
          siblings.

          | | |
          | --- | --- |
          | Version | \`${{ steps.artifact.outputs.version }}\` |
          | Commit | [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |
          | Branch | \`${GITHUB_REF_NAME}\` |
          | Built | $(date -u '+%Y-%m-%d %H:%M UTC') |

          ### Running it

          Download the \`.exe\`, put it wherever you like, and run it. No
          installer, no admin rights, nothing to unpack. Each app keeps its
          state in a folder created next to its own exe — \`DevHubData\`,
          \`LogViewerData\`, \`MarkdownNotebookData\` — so an app travels with its
          file, and swapping in a new build leaves that state alone.

          Requires the Microsoft Edge WebView2 runtime, which ships with
          Windows 10 (from the 2020 updates) and Windows 11.

          Dev Hub's first run writes a starter \`DevHubData/hub.config.json\`.
          Edit it (tray → *Edit hub.config.json*) to point at your repos, URLs,
          health endpoints and log files; the app hot-reloads on save. Log
          Viewer needs no configuration — drop a file on the window, or open one
          from Dev Hub's Logs card.

          ### Expectations

          This is pre-1.0 and unsigned, so SmartScreen will warn on first run.
          It makes no network calls except to the health endpoints and command
          providers you configure yourself. A running executable can't replace
          itself, so there is no auto-update: download and overwrite.
          NOTES
          cat release-notes.md

      # A rolling tag has to be moved, not created, or the second push fails.
      - name: Publish the rolling beta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view beta >/dev/null 2>&1; then
            gh release upload beta dist/*.exe --clobber
            gh release edit beta \
              --target "$GITHUB_SHA" \
              --title "Dev Suite — rolling beta" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create beta dist/*.exe \
              --target "$GITHUB_SHA" \
              --title "Dev Suite — rolling beta" \
              --notes-file release-notes.md \
              --prerelease
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/beta"
          {
            echo "Dev Hub: $BASE/Dev-Hub-beta-win-x64-portable.exe"
            echo "Log Viewer: $BASE/Log-Viewer-beta-win-x64-portable.exe"
            echo "Markdown Notebook: $BASE/Markdown-Notebook-beta-win-x64-portable.exe"
          } >> "$GITHUB_STEP_SUMMARY"
