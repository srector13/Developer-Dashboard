name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes any still-running CI for it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast path: the renderer suite in plain Chromium. The UI is shared with the
  # Rust shell but needs no Windows and no Rust toolchain, so it runs first and
  # cheaply on every push.
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Renderer suite (markdown pipeline + darwin/win32 UI + launcher)
        run: npm run test:renderer

  # The backend's own tests. Pure logic — frontmatter parsing, wiki-link
  # rewriting, ordering, search ranking — so it runs on Linux where runners are
  # cheapest and fastest.
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
                                  libjavascriptcoregtk-4.1-dev
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Everything that only exists on Windows: the WebView2 print path, the
  # CF_HTML clipboard, the tray, and the release build itself.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the portable executable
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Upload the portable exe for inspection
        uses: actions/upload-artifact@v4
        with:
          name: markdown-notebook-portable
          path: src-tauri/target/release/markdown-notebook.exe
          retention-days: 7
