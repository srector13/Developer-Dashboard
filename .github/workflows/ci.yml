name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes any still-running CI for it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast path: typecheck + the 185-check renderer suite in plain Chromium.
  # No Electron binary needed, so this runs on every push cheaply.
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (skip Electron binary)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Typecheck
        run: npm run compile
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Renderer test suite (darwin + win32 simulated platforms + launcher)
        run: npm run test:renderer
      - name: Main-process test suite (scan cache + desktop tooling)
        run: npm run test:main

  # Full Electron end-to-end suite on the real desktop platforms.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Electron e2e suite
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
