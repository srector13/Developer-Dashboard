name: Release

# Pushing a v* tag builds installers + portable/zip artifacts for macOS and
# Windows and attaches them to a draft GitHub Release. Code signing and
# notarization activate automatically when the signing secrets are configured
# (see docs/RELEASING.md); without them the build still succeeds unsigned.
#
# Manual runs (workflow_dispatch) work too: electron-builder creates/updates a
# DRAFT release named v<package.json version> — publishing that draft is what
# creates the tag. Handy when tags can't be pushed from the working machine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + compile
        run: npm run compile

      # electron-builder picks up signing automatically:
      #  - Windows: CSC_LINK (base64 .pfx) + CSC_KEY_PASSWORD
      #  - macOS:   CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD
      # The variables are exported ONLY when the secrets have values — an
      # empty CSC_LINK makes electron-builder think a certificate was
      # provided and the build fails trying to read it as a file.
      - name: Configure code signing (when secrets exist)
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_ID_SECRET" ]; then
            echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      # Notarization is enabled only when Apple credentials exist, by
      # overriding the config's notarize=false on the command line.
      - name: Build and publish (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          EXTRA=()
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            EXTRA+=(-c.mac.notarize.teamId="$APPLE_TEAM_ID")
          fi
          npx electron-builder --mac --publish onTagOrDraft "${EXTRA[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (build inspection)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          retention-days: 7
