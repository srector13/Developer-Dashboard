name: Release

# Pushing a v* tag builds every portable executable in the suite and attaches
# them to one GitHub Release. There is deliberately no installer target: each
# app ships as a single .exe that runs from anywhere.
#
# One release for the whole suite, not one per app: the apps share crates and a
# registry format, so a version means something only if they move together.
#
# A semver prerelease tag (v0.2.0-beta.1) publishes immediately as a GitHub
# pre-release; a plain version tag (v0.2.0) lands as a draft so the notes can be
# reviewed before publishing.
#
# For day-to-day iteration use `.github/workflows/beta.yml` instead — it keeps a
# single rolling `beta` release with a permanent download URL.
#
# Code signing activates automatically when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
# are configured; without them the build still succeeds and produces unsigned
# exes. Signing is done here, once, for every app — which is the practical
# reason the suite is one repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    # Lifted to env because the `secrets` context isn't available to a step's
    # `if:` — this is what makes signing opt-in rather than required.
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          rustup show
          cargo --version

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Unit tests
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --release --workspace

      # The tag is the source of truth for a tag push, so a release can be cut
      # without the version in package.json and the release name drifting
      # apart. Manual runs fall back to package.json.
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          # A semver prerelease (0.2.0-beta.1) publishes as a GitHub pre-release
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Name the artifacts
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.value }}"
          cp "target/release/dev-hub.exe"           "dist/Dev-Hub-$V-win-x64-portable.exe"
          cp "target/release/log-viewer.exe"        "dist/Log-Viewer-$V-win-x64-portable.exe"
          cp "target/release/markdown-notebook.exe" "dist/Markdown-Notebook-$V-win-x64-portable.exe"
          ls -l dist

      # signtool ships with the Windows SDK that windows-latest already has.
      - name: Sign the executable (when secrets exist)
        if: env.WIN_CSC_LINK != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          # Every exe in the suite, from one certificate, in one step.
          Get-ChildItem dist/*.exe | ForEach-Object {
            & $signtool.FullName sign /f cert.pfx /p $env:WIN_CSC_KEY_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item cert.pfx

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-suite-portable
          path: dist/*.exe
          retention-days: 14

      - name: Write the release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Portable Windows builds — one `.exe` per app, nothing to install.

          | App | What it is |
          | --- | --- |
          | **Dev Hub** | A global quick launcher plus a dashboard of live signal from your repos, services, notes and logs. |
          | **Log Viewer** | A multi-file tail with saved filters, highlight rules and timestamp alignment across sources. |
          | **Markdown Notebook** | Local-first markdown notes — one folder of plain files, no account, no sync. |

          The tag versions the *release*; each app carries its own version
          internally, because they are at different points in their lives.

          Download what you want, put it wherever you like (Downloads, a USB
          stick, a work machine you can't install software on), and run it.

          **Put them in the same folder** and they find each other: Dev Hub's
          Logs card opens files in Log Viewer, and each app registers itself so
          the others can launch it. Nothing to configure — discovery goes
          through a per-user registry at `%USERPROFILE%\.dev-suite\registry.json`.

          Each app keeps its state in a folder next to its own exe
          (`DevHubData`, `LogViewerData`, `MarkdownNotebookData`), so an app
          travels with its file.

          Requires the Microsoft Edge WebView2 runtime, which ships with
          Windows 10 (from the 2020 updates) and Windows 11.

          Because a running executable can't replace itself, these builds do not
          self-update: when a new version lands, download it and swap the file.
          Your config is untouched.
          NOTES
          cat release-notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--draft)
          fi
          TAG="v${{ steps.version.outputs.value }}"
          # --target pins the tag to the commit that was built. Without it a
          # manual run would tag the default branch instead of this ref.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe --clobber
            gh release edit "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" dist/*.exe \
              --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
          fi
