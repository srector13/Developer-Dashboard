name: Release

# Pushing a v* tag builds the portable Windows executable and attaches it to a
# draft GitHub Release. There is deliberately no installer target: this build
# ships as a single .exe that runs from anywhere.
#
# Code signing activates automatically when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
# are configured (see docs/RELEASING.md); without them the build still succeeds
# and produces an unsigned exe.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build (release)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Read the version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Name the artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          NAME="Markdown Notebook-${{ steps.version.outputs.value }}-win-x64-portable.exe"
          cp "src-tauri/target/release/markdown-notebook.exe" "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"

      # signtool ships with the Windows SDK that windows-latest already has.
      - name: Sign the executable (when secrets exist)
        if: env.WIN_CSC_LINK != ''
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:WIN_CSC_KEY_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ steps.artifact.outputs.path }}"
          Remove-Item cert.pfx

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-notebook-portable
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 7

      - name: Attach to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          files: ${{ steps.artifact.outputs.path }}
          body: |
            Portable Windows build — a single `.exe` with nothing to install.

            Download it, put it wherever you like (Downloads, a USB stick, a
            work machine you can't install software on), and run it. Settings
            live in a `MarkdownNotebookData` folder created next to the exe, so
            the app travels with it.

            Requires the Microsoft Edge WebView2 runtime, which ships with
            Windows 10 (from 2020 updates) and Windows 11.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
