<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
  <title>Select region</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; background: transparent; user-select: none; }
    #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; -webkit-user-drag: none; }
    #dim { position: fixed; inset: 0; background: rgba(0,0,0,0.45); }
    #sel {
      position: fixed; display: none;
      border: 1.5px solid #6ea8ff;
      box-shadow: 0 0 0 100000px rgba(0,0,0,0.45);
      background: transparent;
    }
    #size {
      position: fixed; display: none;
      font: 12px -apple-system, "Segoe UI", sans-serif;
      background: rgba(20,22,28,0.9); color: #eef0f4;
      padding: 3px 8px; border-radius: 6px; pointer-events: none;
    }
    #tip {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      font: 13px -apple-system, "Segoe UI", sans-serif;
      background: rgba(20,22,28,0.9); color: #eef0f4;
      padding: 6px 14px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <img id="shot" alt="">
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="tip">Drag to capture a region · Esc to cancel</div>

  <script>
    const api = window.regionApi;
    const shotImg = document.getElementById('shot');
    const dim = document.getElementById('dim');
    const sel = document.getElementById('sel');
    const sizeLabel = document.getElementById('size');
    let start = null;

    (async () => {
      try {
        const shot = await api.getShot();
        if (shot && shot.dataUrl) { shotImg.src = shot.dataUrl; dim.style.display = 'none'; }
      } catch {}
    })();

    function rectFrom(a, b) {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
      return { x, y, width: Math.abs(a.x - b.x), height: Math.abs(a.y - b.y) };
    }

    window.addEventListener('mousedown', (e) => {
      start = { x: e.clientX, y: e.clientY };
      sel.style.display = 'block';
      sizeLabel.style.display = 'block';
      updateSel(start);
    });
    window.addEventListener('mousemove', (e) => {
      if (!start) return;
      updateSel({ x: e.clientX, y: e.clientY });
    });
    window.addEventListener('mouseup', async (e) => {
      if (!start) return;
      const r = rectFrom(start, { x: e.clientX, y: e.clientY });
      start = null;
      if (r.width < 3 || r.height < 3) { api.cancel(); return; }
      await api.commit(r);
    });

    function updateSel(cur) {
      const r = rectFrom(start, cur);
      sel.style.left = r.x + 'px'; sel.style.top = r.y + 'px';
      sel.style.width = r.width + 'px'; sel.style.height = r.height + 'px';
      sizeLabel.textContent = `${Math.round(r.width)} × ${Math.round(r.height)}`;
      sizeLabel.style.left = (r.x) + 'px';
      sizeLabel.style.top = Math.max(2, r.y - 24) + 'px';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') api.cancel(); });
  </script>
</body>
</html>
