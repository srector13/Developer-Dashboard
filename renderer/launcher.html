<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
  <title>Launcher</title>
  <style>
    :root {
      --lg-bg: rgba(28, 30, 38, 0.72);
      --lg-border: rgba(255, 255, 255, 0.14);
      --lg-text: #f2f4f8;
      --lg-dim: #a2a8b6;
      --lg-accent: #6ea8ff;
      --lg-orb: rgba(255, 255, 255, 0.08);
      --lg-orb-active: rgba(110, 168, 255, 0.28);
    }
    body.light {
      --lg-bg: rgba(250, 250, 252, 0.82);
      --lg-border: rgba(0, 0, 0, 0.10);
      --lg-text: #1a1c22;
      --lg-dim: #6a7080;
      --lg-orb: rgba(0, 0, 0, 0.05);
      --lg-orb-active: rgba(80, 140, 255, 0.20);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--lg-text);
      user-select: none;
      overflow: hidden;
    }
    #shell {
      margin: 14px;
      border-radius: 22px;
      background: var(--lg-bg);
      border: 1px solid var(--lg-border);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      overflow: hidden;
      -webkit-app-region: drag;
    }
    /* Orb rail */
    #orbs {
      display: flex;
      gap: 10px;
      padding: 16px 18px 6px;
      justify-content: center;
      -webkit-app-region: no-drag;
    }
    .orb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 0.15s ease, transform 0.18s cubic-bezier(.2,.8,.2,1);
      width: 66px;
    }
    .orb .disc {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--lg-orb);
      border: 1px solid var(--lg-border);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease, box-shadow 0.2s ease, transform 0.18s cubic-bezier(.2,.8,.2,1);
    }
    .orb .disc svg { width: 22px; height: 22px; stroke: var(--lg-text); fill: none; stroke-width: 2; }
    .orb .label { font-size: 10.5px; color: var(--lg-dim); letter-spacing: 0.2px; }
    .orb.active { opacity: 1; }
    .orb.active .disc {
      background: var(--lg-orb-active);
      box-shadow: 0 0 0 2px var(--lg-accent), 0 8px 24px rgba(110,168,255,0.35);
      transform: translateY(-3px) scale(1.06);
    }
    .orb.active .label { color: var(--lg-text); font-weight: 600; }
    .orb:hover { opacity: 1; }

    /* Input row */
    #inputrow {
      display: flex; align-items: center;
      padding: 6px 22px 18px;
      -webkit-app-region: no-drag;
    }
    #mode-glyph {
      font-size: 20px; margin-right: 12px; width: 26px; text-align: center; color: var(--lg-dim);
    }
    #q {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: var(--lg-text);
      font-size: 24px; font-weight: 400;
      caret-color: var(--lg-accent);
    }
    #q::placeholder { color: var(--lg-dim); }
    textarea#q { resize: none; height: 34px; line-height: 34px; font-family: inherit; overflow: hidden; }

    /* Results / body area */
    #body { -webkit-app-region: no-drag; }
    #results { list-style: none; padding: 0 10px 10px; max-height: 380px; overflow-y: auto; }
    .result {
      display: flex; flex-direction: column; gap: 2px;
      padding: 9px 14px; margin: 2px 0;
      border-radius: 12px; cursor: pointer;
    }
    .result .r-title { font-size: 14.5px; }
    .result .r-sub { font-size: 11.5px; color: var(--lg-dim); }
    .result .r-sub mark { background: rgba(110,168,255,0.28); color: inherit; border-radius: 3px; padding: 0 2px; }
    .result.sel { background: var(--lg-orb-active); }
    #hint {
      padding: 4px 24px 18px; font-size: 12px; color: var(--lg-dim); line-height: 1.5;
    }
    #hint kbd {
      font-family: inherit; font-size: 11px;
      border: 1px solid var(--lg-border); border-radius: 5px; padding: 1px 6px; color: var(--lg-text);
      background: var(--lg-orb);
    }
    #status { padding: 0 24px 16px; font-size: 12.5px; color: var(--lg-accent); min-height: 0; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="shell">
    <div id="orbs"><!-- built by JS --></div>
    <div id="inputrow">
      <span id="mode-glyph">🔍</span>
      <input id="q" type="text" autofocus spellcheck="false" placeholder="Search notes…">
    </div>
    <div id="body">
      <ul id="results"></ul>
      <div id="hint"></div>
      <div id="status"></div>
    </div>
  </div>

  <script>
    const api = window.launcherApi;

    // Tool definitions — the orbs, in Tab order. `action` tools fire on Enter
    // with no text; `input` tools consume the text field.
    const TOOLS = [
      { id: 'search', label: 'Search', glyph: '🔍', kind: 'input',
        placeholder: 'Search notes…',
        icon: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>' },
      { id: 'note', label: 'Note', glyph: '✏️', kind: 'input',
        placeholder: 'Jot a quick note into today…',
        icon: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>' },
      { id: 'task', label: 'Task', glyph: '☑️', kind: 'input',
        placeholder: 'Add a task to today…',
        icon: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
      { id: 'daily', label: 'Daily', glyph: '📅', kind: 'action',
        placeholder: "Open today's daily note",
        icon: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' },
      { id: 'shot', label: 'Screenshot', glyph: '📸', kind: 'action',
        placeholder: 'Drag a region to capture into today',
        icon: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>' },
      { id: 'scratch', label: 'Scratchpad', glyph: '📝', kind: 'action',
        placeholder: 'Open the floating scratchpad',
        icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>' },
    ];

    let activeIdx = 0;
    let results = [];
    let selResult = 0;
    let searchToken = 0;

    const orbsEl = document.getElementById('orbs');
    const input = document.getElementById('q');
    const glyphEl = document.getElementById('mode-glyph');
    const resultsEl = document.getElementById('results');
    const hintEl = document.getElementById('hint');
    const statusEl = document.getElementById('status');

    function tool() { return TOOLS[activeIdx]; }

    function buildOrbs() {
      orbsEl.innerHTML = TOOLS.map((t, i) => `
        <div class="orb ${i === activeIdx ? 'active' : ''}" data-idx="${i}" title="${t.label}">
          <div class="disc"><svg viewBox="0 0 24 24">${t.icon}</svg></div>
          <div class="label">${t.label}</div>
        </div>`).join('');
      orbsEl.querySelectorAll('.orb').forEach(el => {
        el.addEventListener('click', () => setActive(parseInt(el.dataset.idx, 10)));
      });
    }

    function fitHeight() {
      // Ask main to size the window to the content
      const h = document.getElementById('shell').offsetHeight + 28;
      api.resize(h);
    }

    function renderHint() {
      const t = tool();
      if (t.id === 'search') {
        hintEl.innerHTML = results.length
          ? '<kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Tab</kbd> switches tool'
          : '<kbd>Tab</kbd> switches tool · type to search all notes';
      } else if (t.kind === 'action') {
        hintEl.innerHTML = '<kbd>Enter</kbd> to run · <kbd>Tab</kbd> switches tool';
      } else {
        hintEl.innerHTML = '<kbd>Enter</kbd> to file into today · <kbd>Tab</kbd> switches tool';
      }
    }

    function setActive(idx) {
      const changed = idx !== activeIdx;
      activeIdx = (idx + TOOLS.length) % TOOLS.length;
      const t = tool();
      orbsEl.querySelectorAll('.orb').forEach((el, i) => el.classList.toggle('active', i === activeIdx));
      glyphEl.textContent = t.glyph;
      input.placeholder = t.placeholder;
      input.style.display = t.kind === 'action' ? 'none' : '';
      // Each tool starts with a fresh field — a search query shouldn't leak
      // into a note/task capture, and vice versa.
      if (changed) input.value = '';
      results = [];
      selResult = 0;
      resultsEl.innerHTML = '';
      statusEl.textContent = '';
      renderHint();
      if (t.kind !== 'action') input.focus();
      fitHeight();
      if (t.id === 'search' && input.value.trim()) runSearch();
    }

    async function runSearch() {
      const q = input.value.trim();
      const token = ++searchToken;
      if (!q) { results = []; resultsEl.innerHTML = ''; renderHint(); fitHeight(); return; }
      let rows = [];
      try { rows = await api.search(q); } catch { rows = []; }
      if (token !== searchToken) return; // superseded
      results = rows || [];
      selResult = 0;
      renderResults();
      renderHint();
      fitHeight();
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderResults() {
      if (!results.length) {
        resultsEl.innerHTML = input.value.trim()
          ? '<li class="result"><span class="r-sub">No matching notes</span></li>' : '';
        return;
      }
      resultsEl.innerHTML = results.map((r, i) => `
        <li class="result ${i === selResult ? 'sel' : ''}" data-idx="${i}">
          <span class="r-title">${esc(r.title)}</span>
          <span class="r-sub">${r.snippet ? esc(r.snippet) : esc(r.relPath)}</span>
        </li>`).join('');
      resultsEl.querySelectorAll('.result').forEach(el => {
        if (!el.dataset.idx) return;
        el.addEventListener('click', () => { selResult = parseInt(el.dataset.idx, 10); commit(); });
      });
    }

    function moveSel(dir) {
      if (!results.length) return;
      selResult = (selResult + dir + results.length) % results.length;
      resultsEl.querySelectorAll('.result').forEach((el, i) => el.classList.toggle('sel', i === selResult));
      const sel = resultsEl.querySelector('.result.sel');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    }

    async function flash(msg) {
      statusEl.textContent = msg;
      fitHeight();
    }

    async function commit() {
      const t = tool();
      const text = input.value;
      if (t.id === 'search') {
        const r = results[selResult];
        if (r) api.openNote(r.fsPath);
        return;
      }
      if (t.id === 'daily') { await api.openDaily(); return; }
      if (t.id === 'shot') { await api.screenshot(); api.hide(); return; }
      if (t.id === 'scratch') { await api.openScratchpad(); return; }
      if (t.id === 'note') {
        if (!text.trim()) return;
        const res = await api.capture(text);
        if (res && res.success) { input.value = ''; api.hide(); }
        else flash((res && res.reason) || 'Could not file the note.');
        return;
      }
      if (t.id === 'task') {
        if (!text.trim()) return;
        const res = await api.captureTask(text);
        if (res && res.success) { input.value = ''; api.hide(); }
        else flash((res && res.reason) || 'Could not add the task.');
        return;
      }
    }

    // Keyboard: Tab cycles orbs, Esc closes, ⌘/Ctrl+1..6 jump to a tool,
    // arrows move search selection, Enter runs the active tool.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); api.hide(); return; }
      if (e.key === 'Tab') { e.preventDefault(); setActive(activeIdx + (e.shiftKey ? -1 : 1)); return; }
      if ((e.metaKey || e.ctrlKey) && /^[1-6]$/.test(e.key)) { e.preventDefault(); setActive(parseInt(e.key, 10) - 1); return; }
      const t = tool();
      if (t.id === 'search' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault(); moveSel(e.key === 'ArrowDown' ? 1 : -1); return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        commit();
      }
    });

    let searchTimer = null;
    input.addEventListener('input', () => {
      if (tool().id !== 'search') return;
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 120);
    });

    function resetLauncher() {
      activeIdx = 0;
      input.value = '';
      results = [];
      resultsEl.innerHTML = '';
      statusEl.textContent = '';
      setActive(0);
      input.focus();
    }

    async function init() {
      try {
        const ctx = await api.context();
        if (ctx && ctx.theme) {
          const light = ctx.theme === 'light' || ctx.theme === 'sepia';
          document.body.classList.toggle('light', light);
        }
      } catch {}
      buildOrbs();
      setActive(0);
      input.focus();
    }
    if (api.onReset) api.onReset(resetLauncher);
    window.addEventListener('focus', () => input.focus());
    init();
  </script>
</body>
</html>
