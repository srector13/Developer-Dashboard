<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quick Capture</title>
  <style>
    :root {
      --bg: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #6a737d;
      --accent: #4f8cff;
      --ok: #2da44e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c2128;
        --border: #3a414b;
        --text: #d6dde5;
        --muted: #8b949e;
        --accent: #6ea8ff;
        --ok: #3fb950;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      -webkit-app-region: drag; /* frameless window: the padding is the drag handle */
    }
    .capture-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .capture-title { font-size: 12px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); }
    .capture-hint { font-size: 11px; color: var(--muted); }
    .capture-status { font-size: 11px; color: var(--ok); font-weight: 600; opacity: 0; transition: opacity 0.15s ease; }
    .capture-status.visible { opacity: 1; }
    .capture-status.error { color: #d1242f; }
    textarea {
      -webkit-app-region: no-drag;
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
      padding: 8px 10px;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="capture-head">
    <span class="capture-title">Quick Capture</span>
    <span class="capture-status" id="capture-status"></span>
    <span class="capture-hint">Enter saves to today's note &nbsp;·&nbsp; Esc closes</span>
  </div>
  <textarea id="capture-input" placeholder="Jot something down…" autofocus></textarea>
  <script>
    const input = document.getElementById('capture-input');
    const status = document.getElementById('capture-status');
    let statusTimer = null;
    let sending = false;

    function flashStatus(text, isError) {
      status.textContent = text;
      status.classList.toggle('error', !!isError);
      status.classList.add('visible');
      if (statusTimer) clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove('visible'), 1600);
    }

    async function submit() {
      const text = input.value.trim();
      if (!text || sending) return;
      sending = true;
      try {
        const result = await window.captureApi.appendQuickCapture(text);
        if (result && result.success) {
          input.value = '';
          flashStatus('Captured ✓', false);
          setTimeout(() => window.captureApi.hideCaptureWindow(), 450);
        } else {
          flashStatus((result && result.reason) || 'Capture failed', true);
        }
      } catch (err) {
        flashStatus('Capture failed', true);
      } finally {
        sending = false;
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submit();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        window.captureApi.hideCaptureWindow();
      }
    });

    // Whenever the window is (re)shown and focused, put the caret back
    window.addEventListener('focus', () => input.focus());
  </script>
</body>
</html>
