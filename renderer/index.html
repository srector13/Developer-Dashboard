<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Same policy as launcher.html. `script-src` must allow 'unsafe-inline':
       Tauri injects its IPC bootstrap as an inline script, and because the CSP
       is declared here rather than in tauri.conf.json there is no nonce to
       whitelist it with — a stricter policy leaves window.__TAURI__ undefined
       and the whole dashboard inert. Provider text is escaped on the way into
       the DOM (see app.js) rather than relying on the CSP for that. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost">
  <title>Dev Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <div id="topbar">
    <div id="brand">
      <img src="app-icon.png" alt="">
      <span>Dev Hub</span>
    </div>

    <!-- Deliberately a button, not an input: there is one search surface in
         this app and it is the launcher. Two search boxes with different
         ranking is how a tool starts feeling arbitrary. -->
    <button id="search-wrap" type="button" title="Open the quick launcher">
      <span id="search-icon"></span>
      <span id="search-label">Search everything…</span>
      <span id="search-kbd"></span>
    </button>

    <span class="topbar-spacer"></span>

    <button class="icon-btn" id="refresh-all" title="Refresh every provider">
      <span data-icon="refresh"></span><span>Refresh</span>
    </button>
    <button class="icon-btn" id="open-settings" title="Settings">
      <span data-icon="settings"></span><span>Settings</span>
    </button>
    <button class="icon-btn" id="toggle-theme" title="Switch theme">
      <span data-icon="grid"></span>
    </button>
  </div>

  <div id="banner">
    <span class="banner-text"></span>
    <button class="icon-btn" id="banner-action">Fix it</button>
  </div>

  <main id="grid"></main>

  <div id="settings-overlay">
    <section id="settings-panel" role="dialog" aria-label="Settings">
      <header id="settings-head">
        <h2>Settings</h2>
        <button class="icon-btn" id="settings-close" title="Close">Close</button>
      </header>
      <div id="settings-main">
        <nav id="settings-nav"></nav>
        <div id="settings-body"></div>
      </div>
      <footer id="settings-foot">
        <span class="set-hint">Changes apply when you save. Cards reload straight away.</span>
        <button class="btn-primary" id="settings-save" disabled>Save</button>
      </footer>
    </section>
  </div>

  <div id="setup-overlay">
    <section id="setup-panel" role="dialog" aria-label="Set up Dev Hub">
      <header id="setup-head">
        <img src="app-icon.png" alt="">
        <div>
          <h2>Set up Dev Hub</h2>
          <p>Two questions, then you're done. Everything here can be changed later in Settings.</p>
        </div>
      </header>
      <div id="setup-body"></div>
      <footer id="setup-foot">
        <button class="btn-ghost" id="setup-skip">Skip for now</button>
        <button class="btn-primary" id="setup-finish">Finish</button>
      </footer>
    </section>
  </div>

  <div id="toast"></div>

  <script src="icons.js"></script>
  <script src="api-tauri.js"></script>
  <script src="settings.js"></script>
  <script src="setup.js"></script>
  <script src="app.js"></script>
</body>
</html>
