<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Markdown Notebook</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #6a737d;
      --accent: #4f8cff;
      --border: #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181e;
        --text: #d6dde5;
        --muted: #8b949e;
        --accent: #6ea8ff;
        --border: #2c333c;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      -webkit-app-region: drag;
      user-select: none;
      cursor: default;
    }
    img.logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
    .tagline { font-size: 12px; color: var(--muted); }
    .spinner {
      width: 22px;
      height: 22px;
      margin-top: 6px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <img class="logo" src="../build/icon.png" alt="">
  <h1>Markdown Notebook</h1>
  <div class="tagline">Opening your notebook…</div>
  <div class="spinner" aria-hidden="true"></div>
</body>
</html>
