[workspace]
resolver = "2"
members = [
    "crates/suite-core",
    "crates/suite-config",
    "crates/suite-registry",
    "apps/dev-hub/src-tauri",
    "apps/log-viewer/src-tauri",
    "apps/markdown-notebook/src-tauri",
]

# Every app in the suite ships the same way — one portable exe, copied around by
# hand — so the release profile belongs to the workspace rather than to any one
# of them. Size beats the last few percent of speed when the artefact travels on
# a USB stick.
[workspace.package]
version = "0.2.0-beta.1"
authors = ["Stephen Rector"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
suite-core = { path = "crates/suite-core" }
suite-config = { path = "crates/suite-config" }
suite-registry = { path = "crates/suite-registry" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tauri-build = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "sync", "process"] }
notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
