<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2433"/>
      <stop offset="0.55" stop-color="#10151d"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39c5cf"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square plate -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <rect x="70" y="70" width="884" height="884" rx="198" fill="none" stroke="rgba(88,166,255,0.28)" stroke-width="10"/>

  <!-- Notebook glyph (same book mark used in the app sidebar) -->
  <g filter="url(#glow)">
    <svg x="236" y="236" width="552" height="552" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V5A2.5 2.5 0 0 1 6.5 2.5H20v14H6.5a2.5 2.5 0 0 0-2.5 2.5z"
            fill="none" stroke="url(#ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Markdown text lines on the page -->
      <line x1="9" y1="7"  x2="16.5" y2="7"  stroke="rgba(201,209,217,0.85)" stroke-width="1.1" stroke-linecap="round"/>
      <line x1="9" y1="10" x2="15"   y2="10" stroke="rgba(139,148,158,0.7)"  stroke-width="1.1" stroke-linecap="round"/>
      <line x1="9" y1="13" x2="16"   y2="13" stroke="rgba(139,148,158,0.55)" stroke-width="1.1" stroke-linecap="round"/>
    </svg>
  </g>
</svg>
