<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Windows app icon: the notebook glyph on its own, with no rounded-square
    plate. macOS wants the plate (every icon in the Dock is a squircle);
    Windows does not — taskbar and Explorer icons there are shapes on
    transparency, and a plate just makes the app look boxed-in next to them.

    Because there is no dark plate to sit on, the ink has to read on a light
    taskbar as well as a dark one: everything is drawn in the blue→cyan ink
    gradient, with the page lines stepped down in opacity rather than switched
    to the near-white greys used on the plated version (those vanish on light
    backgrounds). Strokes are a touch heavier than the plated icon's so the
    shape survives at 16px.

    Rendered via scripts/render-win-icons.mjs.
  -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cb6ff"/>
      <stop offset="1" stop-color="#3ddbe6"/>
    </linearGradient>
  </defs>

  <!-- Notebook glyph, scaled to fill the canvas with ~9% breathing room -->
  <svg x="96" y="96" width="832" height="832" viewBox="0 0 24 24">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V5A2.5 2.5 0 0 1 6.5 2.5H20v14H6.5a2.5 2.5 0 0 0-2.5 2.5z"
          fill="none" stroke="url(#ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Markdown text lines on the page. Solid mid-tone blues, NOT url(#ink):
         a <line> has a zero-area bounding box, so an objectBoundingBox
         gradient paints nothing on it and the lines silently disappear.
         These tones stay legible on a white taskbar and on a dark one. -->
    <line x1="9" y1="7"  x2="16.5" y2="7"  stroke="#7fcbf2" stroke-width="1.7" stroke-linecap="round"/>
    <line x1="9" y1="10" x2="15"   y2="10" stroke="#5fb3e0" stroke-width="1.7" stroke-linecap="round"/>
    <line x1="9" y1="13" x2="16"   y2="13" stroke="#4a9bcc" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</svg>
