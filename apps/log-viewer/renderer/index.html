<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Same policy as Dev Hub's windows. `script-src` must allow 'unsafe-inline':
       Tauri injects its IPC bootstrap as an inline script, and because the CSP
       is declared here rather than in tauri.conf.json there is no nonce to
       whitelist it with — a stricter policy leaves window.__TAURI__ undefined
       and the whole window inert. Log text is escaped on the way into the DOM
       (see app.js) rather than relying on the CSP for that, which matters more
       here than anywhere else in the suite: a log line is arbitrary bytes
       written by something else. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ipc: http://ipc.localhost">
  <title>Log Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <div id="topbar">
    <div id="brand">
      <img src="app-icon.png" alt="">
      <span>Log Viewer</span>
    </div>

    <div id="filter-bar">
      <label class="field">
        <span class="field-icon" data-icon="search"></span>
        <input id="query" type="text" spellcheck="false" autocomplete="off"
               placeholder="Filter — Ctrl+F to focus">
      </label>

      <label class="field">
        <span class="field-icon" data-icon="eyeOff"></span>
        <input id="exclude" type="text" spellcheck="false" autocomplete="off"
               placeholder="Exclude">
      </label>

      <div class="toggles">
        <button id="regex" class="toggle" type="button" title="Regular expression">.*</button>
        <button id="case" class="toggle" type="button" title="Match case">Aa</button>
      </div>

      <select id="level" title="Minimum level">
        <option value="unknown">All levels</option>
        <option value="debug">Debug+</option>
        <option value="info">Info+</option>
        <option value="warn">Warn+</option>
        <option value="error">Error+</option>
      </select>
    </div>

    <span class="topbar-spacer"></span>

    <button id="open-file" class="icon-button" type="button" title="Open a log file (Ctrl+O)"
            data-icon="plus"></button>
    <button id="reveal-config" class="icon-button" type="button" title="Show logs.config.json"
            data-icon="settings"></button>
  </div>

  <p id="filter-error" hidden></p>

  <div id="body">
    <aside id="sidebar">
      <section class="panel">
        <h2>Sources</h2>
        <ul id="source-list"></ul>
        <p class="empty" id="sources-empty">
          Nothing open yet. Drop a log file on this window, or press
          <kbd>Ctrl</kbd>+<kbd>O</kbd>.
        </p>
      </section>

      <section class="panel" id="filters-panel" hidden>
        <h2>Saved filters</h2>
        <ul id="filter-list"></ul>
      </section>

      <section class="panel" id="highlights-panel" hidden>
        <h2>Highlights</h2>
        <ul id="highlight-list"></ul>
      </section>
    </aside>

    <main id="log-pane">
      <!-- The scroller holds one spacer sized to the whole result set, with a
           small window of real rows positioned inside it. See app.js. -->
      <div id="scroller" tabindex="0">
        <div id="sizer">
          <div id="rows"></div>
        </div>
      </div>

      <p id="log-empty" class="empty">No lines yet.</p>

      <button id="jump" type="button" hidden>
        <span data-icon="down"></span> Jump to newest
      </button>
    </main>
  </div>

  <footer id="statusbar">
    <span id="counts">—</span>
    <span class="statusbar-spacer"></span>
    <span id="truncated" hidden
          title="The oldest lines were dropped to bound memory. The file on disk still has them.">scrollback trimmed</span>
    <button id="copy" class="text-button" type="button" title="Copy everything shown">Copy view</button>
    <button id="clear" class="text-button" type="button" title="Empty the buffer (Ctrl+L)">Clear</button>
    <button id="follow" class="text-button toggle" type="button" title="Follow new lines (F)">Follow</button>
  </footer>

  <div id="drop-hint" hidden><span>Drop to open</span></div>

  <script src="vendor/suite/icons.js"></script>
  <script src="api-tauri.js"></script>
  <script src="app.js"></script>
</body>
</html>
