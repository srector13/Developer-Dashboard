<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost">
  <title>Dev Hub Launcher</title>
  <style>
    /* The launcher's own chrome variables, lifted from Markdown Notebook so
       the two launchers are indistinguishable in feel. Do not redesign. */
    :root {
      /* Set from settings at open time. The panel sits over whatever window
         you summoned it from, so how transparent is too transparent depends on
         what you keep on screen — hence a setting rather than a constant. */
      --lg-alpha: 0.88;
      --lg-bg: rgba(28, 30, 38, var(--lg-alpha));
      --lg-border: rgba(255, 255, 255, 0.14);
      --lg-text: #f2f4f8;
      --lg-dim: #a2a8b6;
      --lg-accent: #6ea8ff;
      --lg-orb: rgba(255, 255, 255, 0.08);
      --lg-orb-active: rgba(110, 168, 255, 0.28);
      --lg-ok: #3fb950;
      --lg-warn: #f2c94c;
      --lg-error: #f85149;
    }
    body.light {
      --lg-bg: rgba(250, 250, 252, var(--lg-alpha));
      --lg-border: rgba(0, 0, 0, 0.10);
      --lg-text: #1a1c22;
      --lg-dim: #6a7080;
      --lg-orb: rgba(0, 0, 0, 0.05);
      --lg-orb-active: rgba(80, 140, 255, 0.20);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--lg-text);
      user-select: none;
      overflow: hidden;
    }
    #shell {
      margin: 42px;
      border-radius: 22px;
      background: var(--lg-bg);
      border: 1px solid var(--lg-border);
      /* Layered, feathered falloff — each layer stays within the transparent
         margin so the window edge never clips it into a hard line. */
      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.12),
        0 4px 10px rgba(0, 0, 0, 0.16),
        0 12px 24px rgba(0, 0, 0, 0.20),
        0 22px 38px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      overflow: hidden;
      -webkit-app-region: drag;
    }
    /* Orb rail */
    #orbs {
      display: flex;
      gap: 10px;
      padding: 16px 18px 6px;
      justify-content: center;
      -webkit-app-region: no-drag;
    }
    .orb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 0.15s ease, transform 0.18s cubic-bezier(.2,.8,.2,1);
      width: 66px;
    }
    .orb .disc {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--lg-orb);
      border: 1px solid var(--lg-border);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease, box-shadow 0.2s ease, transform 0.18s cubic-bezier(.2,.8,.2,1);
    }
    .orb .disc svg { width: 22px; height: 22px; stroke: var(--lg-text); fill: none; stroke-width: 2; }
    .orb .label { font-size: 10.5px; color: var(--lg-dim); letter-spacing: 0.2px; }
    .orb.active { opacity: 1; }
    .orb.active .disc {
      background: var(--lg-orb-active);
      box-shadow: 0 0 0 2px var(--lg-accent), 0 8px 24px rgba(110,168,255,0.35);
      transform: translateY(-3px) scale(1.06);
    }
    .orb.active .label { color: var(--lg-text); font-weight: 600; }
    .orb:hover { opacity: 1; }
    /* A provider with nothing in it yet: still reachable, visibly quiet. */
    .orb.empty .disc { opacity: 0.45; }

    /* Input row */
    #inputrow {
      display: flex; align-items: center;
      padding: 6px 22px 18px;
      -webkit-app-region: no-drag;
    }
    #mode-glyph {
      margin-right: 12px; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center; color: var(--lg-dim);
    }
    #mode-glyph svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    #q {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: var(--lg-text);
      font-size: 24px; font-weight: 400;
      caret-color: var(--lg-accent);
    }
    #q::placeholder { color: var(--lg-dim); }

    /* Results / body area */
    #body { -webkit-app-region: no-drag; }
    #results { list-style: none; padding: 0 10px 10px; max-height: 380px; overflow-y: auto; }
    .result {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px; margin: 2px 0;
      border-radius: 12px; cursor: pointer;
    }
    .r-actions { display: flex; gap: 6px; flex-shrink: 0; }
    /* A fixed-width leading glyph column, so every title starts at the same x. */
    .r-icon {
      flex: 0 0 22px; display: flex; align-items: center; justify-content: center;
      color: var(--lg-dim);
    }
    .r-icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; }
    .result.sel .r-icon { color: var(--lg-text); }
    .r-btn {
      -webkit-app-region: no-drag;
      width: 30px; height: 30px; border-radius: 8px;
      border: 1px solid var(--lg-border); background: var(--lg-orb);
      color: var(--lg-dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .r-btn:hover { background: var(--lg-orb-active); color: var(--lg-text); }
    .r-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
    .r-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .r-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .r-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--lg-dim); align-self: center; }
    .r-dot.ok { background: var(--lg-ok); }
    .r-dot.warn { background: var(--lg-warn); }
    .r-dot.error { background: var(--lg-error); }
    .r-dot.pending { background: var(--lg-accent); opacity: 0.5; }
    .result .r-title { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result .r-sub { font-size: 11.5px; color: var(--lg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Badges live on the right, in their own column, so titles line up down the
       list instead of each one starting wherever the previous row's chips
       happened to end. */
    .r-meta {
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0; margin-left: auto; padding-left: 12px;
    }
    .r-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 999px;
      background: var(--lg-orb); border: 1px solid var(--lg-border); color: var(--lg-dim);
      white-space: nowrap;
    }
    /* What Enter will do, shown only on the selected row — the answer to "what
       happens if I press this" without hovering anything. */
    .r-enter {
      display: none; align-items: center; gap: 5px;
      font-size: 11px; color: var(--lg-accent); white-space: nowrap;
    }
    .result.sel .r-enter { display: flex; }
    .r-enter kbd {
      font-family: inherit; font-size: 10px;
      border: 1px solid var(--lg-border); border-radius: 4px; padding: 0 4px;
      background: var(--lg-orb); color: var(--lg-text);
    }
    .result.sel { background: var(--lg-orb-active); }
    .result.empty { cursor: default; }

    /* Slash-command completions */
    .cmd { display: flex; align-items: center; gap: 12px; padding: 8px 14px; margin: 2px 0; border-radius: 12px; cursor: pointer; }
    .cmd.sel { background: var(--lg-orb-active); }
    .cmd-name { font-size: 14px; font-weight: 600; min-width: 108px; }
    .cmd-desc { font-size: 11.5px; color: var(--lg-dim); }
    #hint {
      padding: 4px 24px 18px; font-size: 12px; color: var(--lg-dim); line-height: 1.5;
    }
    body.no-hints #hint { display: none; }
    #hint kbd {
      font-family: inherit; font-size: 11px;
      border: 1px solid var(--lg-border); border-radius: 5px; padding: 1px 6px; color: var(--lg-text);
      background: var(--lg-orb);
    }
    #status { padding: 0 24px 16px; font-size: 12.5px; color: var(--lg-accent); min-height: 0; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="shell">
    <div id="orbs"><!-- built by JS --></div>
    <div id="inputrow">
      <span id="mode-glyph"></span>
      <input id="q" type="text" autofocus spellcheck="false" placeholder="Search everything…">
    </div>
    <div id="body">
      <ul id="results"></ul>
      <div id="hint"></div>
      <div id="status"></div>
    </div>
  </div>

  <script src="vendor/suite/icons.js"></script>
  <script src="inline-markdown.js"></script>
  <script src="api-tauri.js"></script>
  <script>
    const api = window.launcherApi;
    const { iconSvg, ACTION_ICONS } = window.DevHubIcons;
    const { renderInline } = window.DevHubMarkdown;

    // Every mode the launcher knows, in Tab order. `input` tools consume the
    // text field and search their provider; an `action` tool fires on Enter
    // with no text. Which of these actually appear is a setting — see
    // `applyLauncherSettings`.
    const ALL_TOOLS = [
      { id: 'all', label: 'All', kind: 'input', provider: null,
        placeholder: 'Search everything…', icon: 'search' },
      { id: 'projects', label: 'Projects', kind: 'input', provider: 'projects',
        placeholder: 'Find a repo…', icon: 'git' },
      { id: 'launch', label: 'Launch', kind: 'input', provider: 'launch',
        placeholder: 'Open an app or a URL…', icon: 'app' },
      { id: 'todos', label: 'Todos', kind: 'input', provider: 'todos',
        placeholder: 'Find a todo…', icon: 'check' },
      { id: 'health', label: 'Health', kind: 'action', provider: 'health',
        placeholder: 'Re-check every endpoint', icon: 'health' },
      { id: 'logs', label: 'Logs', kind: 'input', provider: 'logs',
        placeholder: 'Find a log to tail…', icon: 'file' },
    ];

    /// The modes actually shown, narrowed by settings.
    let TOOLS = ALL_TOOLS.slice();
    /// Appearance and behaviour, replaced wholesale when settings change.
    let launcherSettings = {
      opacity: 0.88, showHints: true,
      modes: ALL_TOOLS.map(t => t.id), maxResults: 40, showRecentWhenEmpty: true,
    };

    // Slash commands: the same modes as the orbs, reachable without leaving the
    // keyboard or knowing which orb is third. `/` alone lists them all; typing
    // narrows; Tab or Enter picks and the rest of the line stays as the query,
    // so "/pr payments" goes straight to a filtered Projects search.
    const ALL_COMMANDS = [
      { name: '/all', tool: 'all', desc: 'Search everything' },
      { name: '/projects', tool: 'projects', desc: 'Git repositories', alias: ['/repos', '/p'] },
      { name: '/apps', tool: 'launch', desc: 'Apps and links', alias: ['/launch', '/a'] },
      { name: '/todos', tool: 'todos', desc: 'Unchecked todos', alias: ['/t'] },
      { name: '/health', tool: 'health', desc: 'Re-check every service', alias: ['/services'] },
    ];

    let activeIdx = 0;
    let results = [];
    let selResult = 0;
    let searchToken = 0;
    /// Non-null while the command palette is showing.
    let commandMatches = null;
    // When non-null, the results list is showing this item's action menu
    // instead of search results.
    let menuItem = null;
    let liveProviders = [];

    const orbsEl = document.getElementById('orbs');
    const input = document.getElementById('q');
    const glyphEl = document.getElementById('mode-glyph');
    const resultsEl = document.getElementById('results');
    const hintEl = document.getElementById('hint');
    const statusEl = document.getElementById('status');

    function tool() { return TOOLS[activeIdx]; }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function buildOrbs() {
      orbsEl.innerHTML = TOOLS.map((t, i) => {
        const quiet = t.provider && liveProviders.length && !liveProviders.includes(t.provider);
        return `
        <div class="orb ${i === activeIdx ? 'active' : ''} ${quiet ? 'empty' : ''}" data-idx="${i}" title="${esc(t.label)}">
          <div class="disc">${iconSvg(t.icon)}</div>
          <div class="label">${esc(t.label)}</div>
        </div>`;
      }).join('');
      orbsEl.querySelectorAll('.orb').forEach(el => {
        el.addEventListener('click', () => setActive(parseInt(el.dataset.idx, 10)));
      });
    }

    function fitHeight() {
      // Ask the backend to size the window to the content (shell + the
      // transparent margin the feathered shadow lives in, top and bottom).
      const h = document.getElementById('shell').offsetHeight + 84;
      api.resize(h);
    }

    function renderHint() {
      if (menuItem) {
        hintEl.innerHTML = '<kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Enter</kbd> to run · <kbd>Esc</kbd> back';
        return;
      }
      const t = tool();
      if (t.kind === 'action') {
        hintEl.innerHTML = '<kbd>Enter</kbd> to re-check · <kbd>Tab</kbd> switches mode';
      } else if (results.length) {
        hintEl.innerHTML = '<kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> for more · <kbd>/</kbd> for commands';
      } else {
        hintEl.innerHTML = '<kbd>Tab</kbd> switches mode · <kbd>/</kbd> lists commands · <kbd>Ctrl</kbd>+<kbd>1</kbd>…<kbd>5</kbd> jumps';
      }
    }

    function setActive(idx) {
      const changed = idx !== activeIdx;
      activeIdx = (idx + TOOLS.length) % TOOLS.length;
      const t = tool();
      orbsEl.querySelectorAll('.orb').forEach((el, i) => el.classList.toggle('active', i === activeIdx));
      glyphEl.innerHTML = iconSvg(t.icon);
      input.placeholder = t.placeholder;
      input.style.display = t.kind === 'action' ? 'none' : '';
      // Each mode starts with a fresh field — a search query must not leak
      // into another mode.
      if (changed) input.value = '';
      menuItem = null;
      commandMatches = null;
      results = [];
      selResult = 0;
      resultsEl.innerHTML = '';
      statusEl.textContent = '';
      renderHint();
      if (t.kind !== 'action') {
        input.focus();
        runSearch();
      } else {
        fitHeight();
      }
    }

    /// The leading `/word` of the current input, if there is one.
    function commandFragment() {
      const match = /^\/(\S*)$/.exec(input.value);
      return match ? `/${match[1]}` : null;
    }

    function matchCommands(fragment) {
      const typed = fragment.toLowerCase();
      // A command for a mode you switched off would be a dead end.
      return ALL_COMMANDS
        .filter(c => TOOLS.some(t => t.id === c.tool))
        .filter(c => c.name.startsWith(typed) || (c.alias || []).some(a => a.startsWith(typed)));
    }

    function renderCommands() {
      resultsEl.innerHTML = commandMatches.length
        ? commandMatches.map((c, i) => `
            <li class="cmd ${i === selResult ? 'sel' : ''}" data-idx="${i}">
              <span class="cmd-name">${esc(c.name)}</span>
              <span class="cmd-desc">${esc(c.desc)}</span>
            </li>`).join('')
        : '<li class="result empty"><span class="r-sub">No such command</span></li>';
      resultsEl.querySelectorAll('.cmd').forEach(el => {
        el.addEventListener('click', () => pickCommand(parseInt(el.dataset.idx, 10)));
      });
      hintEl.innerHTML = '<kbd>↵</kbd> or <kbd>Tab</kbd> to choose · <kbd>Esc</kbd> to clear';
      fitHeight();
    }

    function pickCommand(index) {
      const command = commandMatches && commandMatches[index];
      if (!command) return;
      commandMatches = null;
      const target = TOOLS.findIndex(t => t.id === command.tool);
      input.value = '';
      setActive(target < 0 ? 0 : target);
    }

    /// True when the input opened the command palette, so the caller stops.
    function maybeShowCommands() {
      const fragment = commandFragment();
      if (fragment === null) {
        if (commandMatches) { commandMatches = null; }
        return false;
      }
      commandMatches = matchCommands(fragment);
      selResult = 0;
      renderCommands();
      return true;
    }

    async function runSearch() {
      const t = tool();
      if (t.kind === 'action') return;
      if (maybeShowCommands()) return;
      const q = input.value.trim();
      const token = ++searchToken;
      if (!q && !launcherSettings.showRecentWhenEmpty) {
        results = [];
        selResult = 0;
        renderResults();
        renderHint();
        fitHeight();
        return;
      }
      let rows = [];
      try {
        // An empty query still ranks: usage recency floats the things this
        // person actually opens to the top, so the launcher is useful before
        // the first keystroke.
        rows = await api.search(q, t.provider, q ? launcherSettings.maxResults : 8);
      } catch { rows = []; }
      if (token !== searchToken) return; // superseded by a newer keystroke
      results = rows || [];
      selResult = 0;
      renderResults();
      renderHint();
      fitHeight();
    }

    function statusClass(status) {
      return ['ok', 'warn', 'error', 'pending'].includes(status) ? status : '';
    }

    function rowHtml(item, i) {
      const all = item.actions || [];
      // One button — the action menu — instead of a rank of glyphs. The
      // default action is named on the selected row instead, which is the
      // thing you actually want to know.
      const more = all.length > 1
        ? `<button class="r-btn" data-more="1" data-idx="${i}" title="More actions (Ctrl+Enter)">${iconSvg('command')}</button>`
        : '';
      const badges = (item.badges || []).slice(0, 3)
        .map(b => `<span class="r-badge">${esc(b)}</span>`).join('');
      const enter = all.length
        ? `<span class="r-enter"><kbd>↵</kbd>${esc(all[0].label)}</span>` : '';
      return `
        <li class="result ${i === selResult ? 'sel' : ''}" data-idx="${i}">
          <span class="r-icon">${iconSvg(item.icon || 'dot')}</span>
          <span class="r-main">
            <span class="r-head">
              <span class="r-dot ${statusClass(item.status)}"></span>
              <span class="r-title">${renderInline(item.title, item.richTitle)}</span>
            </span>
            <span class="r-sub">${esc(item.subtitle || '')}</span>
          </span>
          <span class="r-meta">${badges}${enter}${more}</span>
        </li>`;
    }

    function renderResults() {
      if (menuItem) { renderMenu(); return; }
      if (!results.length) {
        resultsEl.innerHTML = input.value.trim()
          ? '<li class="result empty"><span class="r-sub">Nothing matched</span></li>' : '';
        return;
      }
      resultsEl.innerHTML = results.map(rowHtml).join('');
      resultsEl.querySelectorAll('.result .r-main').forEach(el => {
        el.addEventListener('click', () => {
          const i = parseInt(el.closest('.result').dataset.idx, 10);
          runAction(results[i], 0);
        });
      });
      resultsEl.querySelectorAll('.r-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const i = parseInt(btn.dataset.idx, 10);
          if (btn.dataset.more) openMenu(i);
          else runAction(results[i], parseInt(btn.dataset.act, 10));
        });
      });
    }

    function renderMenu() {
      const actions = menuItem.actions || [];
      resultsEl.innerHTML = actions.map((a, i) => `
        <li class="result ${i === selResult ? 'sel' : ''}" data-idx="${i}">
          <span class="r-actions"><span class="r-btn">${iconSvg(ACTION_ICONS[a.kind] || 'chevron')}</span></span>
          <span class="r-main">
            <span class="r-head"><span class="r-title">${esc(a.label)}</span></span>
            <span class="r-sub">${esc(menuItem.title)}</span>
          </span>
        </li>`).join('');
      resultsEl.querySelectorAll('.result').forEach(el => {
        el.addEventListener('click', () => runAction(menuItem, parseInt(el.dataset.idx, 10)));
      });
    }

    function openMenu(i) {
      const item = results[i];
      if (!item || !(item.actions || []).length) return;
      menuItem = item;
      selResult = 0;
      renderResults();
      renderHint();
      fitHeight();
    }

    function closeMenu() {
      menuItem = null;
      selResult = 0;
      renderResults();
      renderHint();
      fitHeight();
    }

    async function runAction(item, actionIndex) {
      if (!item || !(item.actions || []).length) {
        flash('That item has nothing to open — check hub.config.json.');
        return;
      }
      let res;
      try { res = await api.run(`${item.provider}::${item.id}`, actionIndex); }
      catch (err) { res = { success: false, message: String(err) }; }
      if (res && res.success) api.hide();
      else flash((res && res.message) || 'That action did not run.');
    }

    function moveSel(dir) {
      const length = commandMatches
        ? commandMatches.length
        : menuItem ? (menuItem.actions || []).length : results.length;
      if (!length) return;
      selResult = (selResult + dir + length) % length;
      resultsEl.querySelectorAll('.result, .cmd').forEach((el, i) => el.classList.toggle('sel', i === selResult));
      const sel = resultsEl.querySelector('.sel');
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    }

    function flash(message) {
      statusEl.textContent = message;
      fitHeight();
    }

    async function recheckHealth() {
      flash('Re-checking…');
      let result;
      try { result = await api.refresh('health'); }
      catch (err) { flash(String(err)); return; }
      results = (result && result.items) || [];
      selResult = 0;
      menuItem = null;
      renderResults();
      statusEl.textContent = (result && result.error) ? result.error : '';
      renderHint();
      fitHeight();
    }

    function commit(withModifier) {
      if (commandMatches) { pickCommand(selResult); return; }
      if (menuItem) { runAction(menuItem, selResult); return; }
      const t = tool();
      if (t.id === 'health') { recheckHealth(); return; }
      if (!results.length) return;
      if (withModifier) { openMenu(selResult); return; }
      runAction(results[selResult], 0);
    }

    // Keyboard: Tab cycles orbs, Esc closes (or leaves the action menu),
    // Ctrl+1..5 jump, arrows move selection, Enter runs the default action and
    // Ctrl+Enter opens the action menu.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        if (commandMatches) { commandMatches = null; input.value = ''; runSearch(); }
        else if (menuItem) closeMenu();
        else api.hide();
        return;
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        // While the palette is open Tab completes the command rather than
        // cycling modes — it is the key your hands already expect there.
        if (commandMatches) pickCommand(selResult);
        else setActive(activeIdx + (e.shiftKey ? -1 : 1));
        return;
      }
      // Numbered against the modes actually shown, so Ctrl+3 is always the
      // third orb rather than the third of a list you can't see.
      if ((e.metaKey || e.ctrlKey) && /^[1-9]$/.test(e.key)) {
        const index = parseInt(e.key, 10) - 1;
        if (index < TOOLS.length) { e.preventDefault(); setActive(index); }
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); moveSel(e.key === 'ArrowDown' ? 1 : -1); return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        commit(e.ctrlKey || e.metaKey);
      }
    });

    let searchTimer = null;
    input.addEventListener('input', () => {
      if (tool().kind === 'action') return;
      if (menuItem) menuItem = null;
      if (searchTimer) clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 120);
    });

    function resetLauncher() {
      activeIdx = 0;
      input.value = '';
      results = [];
      menuItem = null;
      commandMatches = null;
      resultsEl.innerHTML = '';
      statusEl.textContent = '';
      setActive(0);
      input.focus();
    }

    /// Apply a settings block: opacity, hints, and which orbs exist.
    function applyLauncherSettings(next) {
      launcherSettings = Object.assign({}, launcherSettings, next || {});

      document.documentElement.style.setProperty('--lg-alpha', String(launcherSettings.opacity));
      document.body.classList.toggle('no-hints', !launcherSettings.showHints);

      const wanted = Array.isArray(launcherSettings.modes) ? launcherSettings.modes : [];
      const chosen = wanted
        .map(id => ALL_TOOLS.find(t => t.id === id))
        .filter(Boolean);
      // Never end up with nothing to search, whatever the file says.
      TOOLS = chosen.length ? chosen : ALL_TOOLS.slice();
      if (activeIdx >= TOOLS.length) activeIdx = 0;
    }

    async function loadContext() {
      try {
        const ctx = await api.context();
        if (!ctx) return;
        // "system" resolves here rather than in Rust, because the webview is
        // the only thing that knows what the OS is currently asking for.
        const light = ctx.theme === 'light' || (ctx.theme === 'system'
          && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.body.classList.toggle('light', !!light);
        liveProviders = ctx.providers || [];
        applyLauncherSettings(ctx.launcher);
      } catch {}
    }

    async function init() {
      await loadContext();
      buildOrbs();
      setActive(0);
      input.focus();
    }

    if (api.onReset) api.onReset(resetLauncher);
    // Settings changed while this window was alive — re-read rather than
    // waiting for a rebuild that may never happen, since the window is reused.
    if (api.onSettingsChanged) {
      api.onSettingsChanged(async () => {
        await loadContext();
        buildOrbs();
        setActive(Math.min(activeIdx, TOOLS.length - 1));
      });
    }
    window.addEventListener('focus', () => input.focus());
    init();
  </script>
</body>
</html>
